<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | BatchBite</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/kitchen.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="container" style="max-width:820px">
    <div class="page-head">
      <div>
        <h1>Notifications</h1>
        <p id="notif-summary">Updates about your orders.</p>
      </div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button type="button" class="btn btn-secondary" id="read-all-btn" hidden>Mark all as read</button>
        <button type="button" class="btn btn-primary" id="refresh-btn">Refresh</button>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Filter notifications" style="margin-bottom:1rem">
      <button type="button" role="tab" class="tab active" aria-selected="true" data-filter="all">All</button>
      <button type="button" role="tab" class="tab" aria-selected="false" data-filter="unread">Unread</button>
    </div>

    <div class="notif-list" id="notif-list" aria-live="polite">
      <p class="loading">Loading notifications...</p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/notifications.js"></script>
</body>
</html>
