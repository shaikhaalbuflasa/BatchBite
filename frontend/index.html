<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BatchBite</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Entry point: a fresh install goes to first-run setup; signed-in users go
    // to Home; everyone else to Log in
    Api.request('/setup/status')
      .then(status => status.needsAdministrator ? 'setup.html' : null)
      .catch(() => null)
      .then(setup => location.replace(setup || (Auth.currentUser() ? 'home.html' : 'login.html')));
  </script>
</body>
</html>
