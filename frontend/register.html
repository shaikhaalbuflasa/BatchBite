<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | BatchBite</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/accounts.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card wide">
      <div class="auth-logo">
        <div class="logo-circle">B</div>
        <h1>Create your account</h1>
        <p>Join BatchBite as a customer or a business</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-error" role="alert" hidden></div>

        <fieldset class="field role-pick">
          <legend>I am signing up as a</legend>
          <div class="role-options">
            <label class="role-option"><input type="radio" name="accountType" value="Customer" checked><span><strong>Customer</strong>Order from open batches</span></label>
            <label class="role-option"><input type="radio" name="accountType" value="BusinessOwner"><span><strong>Business Owner</strong>Sell your bakes in batches</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Fatima Ali" autocomplete="name" maxlength="60" required>
          <div class="field-error" data-error-for="name"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          <div class="field-error" data-error-for="email"></div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" autocomplete="new-password" required>
              <button type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <div class="hint">At least 8 characters.</div>
            <div class="field-error" data-error-for="password"></div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
              <button type="button" data-toggle-password="confirmPassword" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <div class="field-error" data-error-for="confirmPassword"></div>
          </div>
        </div>

        <p class="hint small" style="margin:-.2rem 0 1.1rem">Kitchen Staff don't sign up: their Business Owner creates their account. The Administrator account is created when BatchBite is first set up.</p>

        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
