<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | BatchBite</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-logo">
        <div class="logo-circle">B</div>
        <h1>BatchBite</h1>
        <p>Preorders made simple for small food businesses</p>
      </div>

      <div class="form-notice" id="notice" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-error" role="alert" hidden></div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          <div class="field-error" data-error-for="email"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <div class="field-error" data-error-for="password"></div>
        </div>

        <div class="row-between" style="margin-bottom:1.2rem">
          <label class="check"><input type="checkbox" name="remember"> Keep me signed in</label>
          <button type="button" class="link-btn small" id="forgot-btn">Forgot password?</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
